[project]
name = "ansbot"
version = "0.1.0"
description = "QQ 群问答机器人（nonebot2 + OneBot v11，混合打分检索）"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.23.0",
]

[tool.nonebot]
adapters = ["~onebot.v11"]
plugin_dirs = ["src/plugins"]
